<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta property="og:image" content="images/cortex_sheet_preview.png" />
	<link href="sheet.css" rel="stylesheet">
	<script type="module" src="./modules/sheet.js" charset="utf-8"></script>
</head>

<body>

	<!-- Modal Dialogs -->
	<div id="modal-bg" onclick="close_modal(event)"></div>

	<!-- Toolbar -->
	<div id="toolbar" class="no-print">
		<div id="campaigns" title="Campaigns" onclick="campaigns_menu(event)"></div>
		<div id="characters" title="Characters" onclick="characters_menu(event)"></div>
		<div id="upload" title="Save Sheet to Cloud" onclick="upload_character(event)"></div>
		<div id="download" title="Download Sheet to File" onclick="download_character(event)"></div>
		<hr>
		<div title="Highlight Color">
			<input id="global-highlight-picker" type="color" value="#C50852" onchange="set_global_highlight_color(event)"
				oninput="set_global_highlight_color(event)"></input>
		</div>
		<div id="toggle-layout-controls" title="Toggle Layout Controls" onclick="layoutControlsHidden.toggle(event)"></div>
		<div id="toggle-empty-descriptions" title="Toggle Empty Descriptions"
			onclick="emptyDescriptionsHidden.toggle(event)"></div>
		<hr>
		<div id="toggle-messaging" title="Messages & Dice Rolls" onclick="toggleMessaging(event)"></div>
		<hr>
		<div id="help" title="Help" onclick="helpModal.show()"></div>
		<hr class="development development-hidden">
		<div class="development development-hidden" id="development-hook" title="Development Hook" onclick="developmentHook(event)"></div>
	</div>
	<div id="current-campaign" class="no-print">
	</div>
	<div id="account" class="no-print">
		<div id="displayName">Not Signed In</div>
		<div id="displayEmoji">👤</div>
	</div>

	<!-- Messaging -->
	<div id="messaging" class="no-print messaging-hidden">
		<ul id="messages">
			<div id="fetch-older"><i class="icon older"></i></div>
		</ul>
		<input id="message-text" type="text" placeholder="Enter message"></input>
		<table id="dice" class="dice-input">
			<tr id="die-0" class="die-input">
				<td class="die-input-label"><input type="text" placeholder="Trait name"></input></td>
				<td class="die-input-size"><h2 class="trait-value"><d contenteditable>∅</d></h2></td>
			</tr>
		</table>
		<div id="post-controls"><button type="button" id="message-post">Post</button><i id="message-clear" class="icon trash"></i></div>
	</div>

	<!-- Page -->
	<div id="pages" class="pages">
		<div class="page">
			<div>
				<div class="row" id="name">
					<div contenteditable class="title" id="character-name">NAME</div>
					<div class="ruler">
						<svg height="4" width="100%">
							<line x1="0" y1="0" x2="10000" y2="0" style="stroke:var(--highlight);stroke-width:4pt" />
						</svg>
					</div>
				</div>
				<div contenteditable id="description">Description</div>
			</div>
			<div class="page-column left">
				<div id="trait-group-placeholder" class="add-item no-print" onclick="add_trait_group(event)"
					data-onload="add_trait_group">
				</div>
			</div>
			<div class="page-column right">
				<div id="trait-group-placeholder" class="add-item no-print" onclick="add_trait_group(event)"
					data-onload="add_trait_group">
				</div>
			</div>
		</div>
		<div id="page-placeholder" class="add-item no-print" onclick="add_page(event)" data-onload="add_page">
		</div>
	</div>

</body>

</html>
