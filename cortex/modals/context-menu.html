<div id="context-menu" class="modal context-menu">
  <ul>
    <li>
      <div id="color-selection">
        <input id="trait-collection-highlight-picker" type="color" value="#C50852"
          onchange="traitGroupContextMenu.setTraitGroupHighlightColor(event)"
          oninput="traitGroupContextMenu.setTraitGroupHighlightColor(event)" />
        <span id="color-removal" onclick="traitGroupContextMenu.removeTraitGroupHighlightColor(event)"></span>
      </div>
    </li>
    <li>Style<i class="fa-angle-right"></i>
      <div class="context-menu" id="styles">
        <input type="radio" name="style" data-style="detailed" id="style-detailed"
          onchange="traitGroupContextMenu.setStyle(event)" /><label for="style-detailed">Detailed</label>
        <input type="radio" name="style" data-style="compact" id="style-compact"
          onchange="traitGroupContextMenu.setStyle(event)" /><label for="style-compact">Compact</label>
        <input type="radio" name="style" data-style="inline" id="style-inline"
          onchange="traitGroupContextMenu.setStyle(event)" /><label for="style-inline">Inline</label>
        <input type="radio" name="style" data-style="detailed two-column" id="style-detailed-two-columns"
          onchange="traitGroupContextMenu.setStyle(event)" /><label for="style-detailed-two-columns">Detailed Two-Columns</label>
        <input type="radio" name="style" data-style="compact two-column" id="style-compact-two-columns"
          onchange="traitGroupContextMenu.setStyle(event)" /><label for="style-compact-two-columns">Compact Two-Columns</label>
        <input type="radio" name="style" data-style="stress" id="style-stress-detailed"
          onchange="traitGroupContextMenu.setStyle(event)" /><label for="style-stress-detailed">Detailed Stress</label>
        <input type="radio" name="style" data-style="stress compact" id="style-stress-compact"
          onchange="traitGroupContextMenu.setStyle(event)" /><label for="style-stress-compact">Compact Stress</label>
        <input type="radio" name="style" data-style="signature-asset" id="style-asset"
          onchange="traitGroupContextMenu.setStyle(event)" /><label for="style-asset">Asset</label>
        <input type="radio" name="style" data-style="resources" id="style-resource"
          onchange="traitGroupContextMenu.setStyle(event)" /><label for="style-resource">Resource</label>
        <input type="radio" name="style" data-style="roles" id="style-roles"
          onchange="traitGroupContextMenu.setStyle(event)" /><label for="style-roles">Roles</label>
        <input type="radio" name="style" data-style="values" id="style-values"
          onchange="traitGroupContextMenu.setStyle(event)" /><label for="style-values">Values</label>
      </div>
    </li>
    <li>Move<i class="fa-angle-right"></i>
      <div class="context-menu" id="movement">
        <ul>
          <li onclick="traitGroupContextMenu.moveToTop(event)">To Top</li>
          <li onclick="traitGroupContextMenu.moveUp(event)">Up</li>
          <li onclick="traitGroupContextMenu.moveDown(event)">Down</li>
          <li onclick="traitGroupContextMenu.moveToBottom(event)">To Bottom</li>
          <li onclick="traitGroupContextMenu.moveToOtherColumn(event)">To Other Column</li>
          <li onclick="traitGroupContextMenu.moveToPreviousPage(event)">To Previous Page</li>
          <li onclick="traitGroupContextMenu.moveToNextPage(event)">To Next Page</li>
        </ul>
      </div>
    </li>
    <li onclick="traitGroupContextMenu.removeTraitGroup(event)">Delete</li>
  </ul>
</div>
